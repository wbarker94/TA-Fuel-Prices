<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TravelCenters of America · Fuel Prices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#0066AA;      /* TA blue */
    --red:#EE3124;       /* TA red */
    --navy:#004E84;      /* deeper TA blue */
    --text:#FFFFFF;
    --muted:#D3E5F3;
    --ink:#14212E;
    --ink-muted:#5B6773;
    --up:#C4261D;
    --down:#1A8A4A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  body{font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text)}

  /* Keeps the 856 x 559 (about 3:2) shape at every width; sizes scale with the widget's width */
  .widget{
    container-type:inline-size;
    width:100%;min-width:220px;max-width:900px;margin:0 auto;
    aspect-ratio:856 / 559;
    display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--blue) 0%,var(--navy) 100%);
    border-radius:clamp(10px,1.6cqi,14px);
    border-top:clamp(3px,.6cqi,5px) solid var(--red);
  }
  .inner{flex:1;display:flex;flex-direction:column;padding:3.2cqi 3.6cqi}

  .top{display:flex;align-items:center;gap:2.4cqi}
  .badge{background:#FFFFFF;border-radius:clamp(4px,1cqi,8px);padding:clamp(3px,.9cqi,8px);display:inline-flex;line-height:0;flex:0 0 auto}
  .logo{height:clamp(24px,6.6cqi,58px);width:auto;display:block}
  h1{flex:1;min-width:0;font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:700;
     font-size:clamp(16px,5.2cqi,44px);line-height:1;letter-spacing:.01em;text-transform:uppercase}
  .tag{font-size:clamp(10px,1.6cqi,14px);color:var(--muted);font-weight:600;white-space:nowrap}
  .lane{height:max(2px,.35cqi);margin:2.2cqi 0 0;opacity:.85;
        background:repeating-linear-gradient(90deg,#FFFFFF 0 3cqi,transparent 3cqi 5.2cqi)}

  .signs{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqi;margin-block:auto}
  .sign,.traffic{border-radius:clamp(6px,1.2cqi,10px);padding:1.7cqi 1.9cqi;min-width:0;display:flex;flex-direction:column}
  .sign{background:#FFFFFF;color:var(--ink)}
  .fuel{align-self:flex-start;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;
        text-transform:uppercase;letter-spacing:.06em;font-size:clamp(9px,1.5cqi,13px);line-height:1.25;
        padding:.25em .6em;border-radius:3px;background:var(--blue);color:#FFFFFF}
  .diesel .fuel{background:var(--red)}
  .price{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:700;line-height:.95;
         font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:.8cqi;font-size:clamp(20px,6.2cqi,52px)}
  .diesel .price{color:var(--red)} .gas .price{color:var(--blue)}
  .price .tenth{font-size:.42em;vertical-align:super;margin-left:1px}
  .unit,.change,.trend-lbl,.t-sub{font-size:clamp(9px,1.5cqi,13px);line-height:1.25}
  .unit,.trend-lbl{color:var(--ink-muted)}
  .change{font-weight:600;margin-top:.4cqi}
  .change.up{color:var(--up)} .change.down{color:var(--down)} .change.flat{color:var(--ink-muted)}
  .change span{color:var(--ink-muted);font-weight:400}
  .trend{margin-top:auto;padding-top:.9cqi}
  .trend svg{display:block;width:100%;height:clamp(12px,2.8cqi,24px)}
  .trend-lbl{margin-top:2px}

  .traffic{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28)}
  .t-head{display:flex;align-items:flex-start;gap:1.2cqi}
  .traffic svg{flex:0 0 auto;width:clamp(16px,3.8cqi,34px);height:auto;margin-top:2px}
  .t-lbl{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;text-transform:uppercase;
         letter-spacing:.05em;font-size:clamp(9px,1.5cqi,13px);line-height:1.2}
  .t-sub{color:var(--muted)}
  .t-count{margin-top:auto;padding-top:.8cqi}
  .t-num{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:700;line-height:1;
         font-size:clamp(20px,5cqi,44px);font-variant-numeric:tabular-nums}
  .t-up{display:inline-block;margin-top:.6cqi;background:var(--red);color:#fff;font-weight:600;
        font-size:clamp(9px,1.35cqi,12px);padding:1px .6em;border-radius:999px;white-space:nowrap}

  .foot{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:clamp(9px,1.5cqi,13px)}
  .foot strong{color:var(--text);font-weight:600}

  .short{display:none}
  @container (max-width:480px){ .gas .fuel .long{display:none} .gas .fuel .short{display:inline} }

  /* Phone widths: trim secondary text so the 3:2 shape stays readable */
  @container (max-width:560px){
    .tag,.trend-lbl,.t-sub{display:none}
    .change span{display:none}
  }
  @container (max-width:340px){
    .unit,.trend,#next{display:none}
    .t-up{font-size:8px}
    .t-lbl .long,.traffic svg,.pill-more{display:none}
    .t-lbl .short{display:inline}
    h1{font-size:14px}
    .logo{height:22px}
    .t-num{font-size:18px}
    .price{font-size:18px}
  }
</style>
</head>

        <div class="t-head"><svg viewBox="0 0 48 32" aria-hidden="true"><rect x="2" y="6" width="28" height="18" rx="2" fill="#FFFFFF"/><path d="M30 12h8l6 6v6H30z" fill="#FFFFFF"/><path d="M33 14h4.5l3.5 4H33z" fill="var(--blue)"/><circle cx="11" cy="26" r="4" fill="var(--red)" stroke="#FFFFFF" stroke-width="2"/><circle cx="37" cy="26" r="4" fill="var(--red)" stroke="#FFFFFF" stroke-width="2"/></svg><div class="t-text"><div class="t-lbl"><span class="long">Traffic into the travel center</span><span class="short">Traffic today</span></div><div class="t-sub">Vehicles today</div></div></div>
        <div class="t-count">
          <div class="t-num" id="traffic">—</div>
          <span class="t-up" id="traffic-up">+20</span>
        </div>
      </div>
    </div>

    <div class="foot">
      <span>Updated <strong id="updated">—</strong></span>
      <span id="next">Next update in — min</span>
    </div>
  </div>
</section>

<script>
(function(){
  // Demo pricing: prices step every 15 minutes, drifting down 25¢ from the
  // baseline and back up again. Based on the clock, so every viewer sees the same price.
  const STEP = 15 * 60 * 1000;          // 15 minutes
  const HALF = 12;                      // 12 steps down (3 hrs), 12 steps up (3 hrs)
  const RANGE = 0.25;                   // dollars
  const FUELS = {
    diesel:   { base: 5.99, phase: 0 },
    gasoline: { base: 4.19, phase: 7 }  // offset so the two don't move in lockstep
  };

  const TRAFFIC_START = 100;   // vehicles at midnight
  const TRAFFIC_STEP  = 20;    // added every 15 minutes

  // small, repeatable wobble so the line isn't perfectly straight
  function wobble(n){ const x = Math.sin(n * 12.9898) * 43758.5453; return (x - Math.floor(x) - .5) * 0.012; }

  function priceAt(fuel, n){
    const k = ((n + fuel.phase) % (HALF * 2) + HALF * 2) % (HALF * 2);
    const depth = k <= HALF ? k / HALF : (2 * HALF - k) / HALF;   // 0 → 1 → 0
    let p = fuel.base - depth * RANGE + (k % HALF ? wobble(n + fuel.phase) : 0);
    p = Math.min(fuel.base, Math.max(fuel.base - RANGE, p));
    return Math.round(p * 100) / 100 + 0.009;                       // pump-style 9/10¢
  }

  function priceHTML(v){
    const s = v.toFixed(3);
    return '$' + s.slice(0,-1) + '<span class="tenth">' + s.slice(-1) + '</span>';
  }

  function spark(vals){
    const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
    return vals.map((v,i) => {
      const x = (i / (vals.length - 1)) * 200;
      const y = 44 - ((v - min) / span) * 40;
      return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }).join(' ');
  }

  let lastStep = null;

  function render(){
    const now = Date.now(), n = Math.floor(now / STEP);
    const minsLeft = Math.max(1, Math.ceil(((n + 1) * STEP - now) / 60000));
    document.getElementById('next').textContent = 'Next update in ' + minsLeft + ' min';
    if (n === lastStep) return;
    lastStep = n;

    for (const [key, fuel] of Object.entries(FUELS)){
      const el = document.getElementById('sign-' + key);
      const hist = Array.from({length: 12}, (_, i) => priceAt(fuel, n - 11 + i));
      const last = hist[11], prev = hist[10], diff = (last - prev) * 100;
      el.querySelector('[data-f="price"]').innerHTML = priceHTML(last);
      const ch = el.querySelector('[data-f="change"]');
      if (Math.abs(diff) < 0.5){ ch.className = 'change flat'; ch.innerHTML = 'No change <span>since last update</span>'; }
      else {
        const up = diff > 0;
        ch.className = 'change ' + (up ? 'up' : 'down');
        ch.innerHTML = (up ? '▲ ' : '▼ ') + Math.round(Math.abs(diff)) + '¢ <span>since last update</span>';
      }
      el.querySelector('[data-f="spark"]').setAttribute('d', spark(hist));
      el.querySelector('[data-f="trendlbl"]').textContent = 'Last 3 hours';
    }
    // Traffic: starts the day at 100 vehicles and adds 20 every 15 minutes, resetting at midnight.
    const d = new Date(n * STEP), midnight = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const stepsToday = Math.round((n * STEP - midnight) / STEP);
    document.getElementById('traffic').textContent = (TRAFFIC_START + TRAFFIC_STEP * stepsToday).toLocaleString('en-US');
    document.getElementById('traffic-up').innerHTML = '+' + TRAFFIC_STEP + '<span class="pill-more"> in 15 min</span>';

    document.getElementById('updated').textContent =
      new Date(n * STEP).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
  }

  render();
  setInterval(render, 15 * 1000);   // checks every 15 seconds; prices move every 15 minutes
})();
</script>
</body>
</html>
